      <rect x="150" y="640" width="724" height="16" fill="#000"/>
      <rect x="150" y="690" width="724" height="24" fill="#000"/>
      <rect x="150" y="748" width="724" height="32" fill="#000"/>
      <rect x="150" y="814" width="724" height="42" fill="#000"/>
