    <path d="M268 492l96-22M258 540l150-36" stroke="#2de2e6" stroke-width="16" stroke-linecap="round" opacity=".9"/>
    <path d="M606 492l96-22M596 540l150-36" stroke="#ff4fa3" stroke-width="16" stroke-linecap="round" opacity=".9"/>
