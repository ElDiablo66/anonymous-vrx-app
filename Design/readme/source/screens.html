<!doctype html>
<!-- Source of Design/readme/screens.png. Render like hero.html, at 1280x1300. -->
<meta charset="utf-8" />
<title>Anonymous VRX screens</title>
<link rel="stylesheet" href="poster.css" />
<style>
  body.board { height: 1300px; }
  .board .tile { width: 560px; }
  .t1 { left: 650px; top: 40px; transform: rotate(2deg); }
  .t2 { left: 60px; top: 270px; transform: rotate(-1.5deg); }
  .t3 { left: 660px; top: 380px; transform: rotate(1.5deg); }
  .t4 { left: 60px; top: 620px; transform: rotate(1.8deg); }
  .t5 { left: 660px; top: 720px; transform: rotate(-2deg); }
  .t6 { left: 70px; top: 990px; transform: rotate(-1deg); }
  .t1 .panel { box-shadow: 9px 9px 0 #ff6a9a; }
  .t2 .panel { box-shadow: 9px 9px 0 #ffc46b; }
  .t3 .panel { box-shadow: 9px 9px 0 #b56dff; }
  .t4 .panel { box-shadow: 9px 9px 0 #4fd8e0; }
  .t5 .panel { box-shadow: 9px 9px 0 #6fe0a8; }
  .t6 .panel { box-shadow: 9px 9px 0 #ff4f8a; }
  .t1 figcaption { background: #ff6a9a; }
  .t2 figcaption { background: #ffc46b; }
  .t3 figcaption { background: #c79bff; }
  .t4 figcaption { background: #4fd8e0; }
  .t5 figcaption { background: #6fe0a8; }
  .t6 figcaption { background: #ff4f8a; }
  .board .sun { left: 860px; top: 1010px; width: 320px; height: 320px; }
  .board .sea { inset: 1230px 0 0 0; }
</style>
<body class="board">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="sea"></div>

  <section class="head">
    <p class="stamp">Anonymous VRX 0.1.6</p>
    <h1><span>The whole</span><span>night, logged</span></h1>
  </section>

  <figure class="tile t1"><div class="panel"><img src="../shots/around%20map.webp" alt="" /></div><figcaption>Map of every instance</figcaption></figure>
  <figure class="tile t2"><div class="panel"><img src="../shots/history%20search.webp" alt="" /></div><figcaption>Search your own history</figcaption></figure>
  <figure class="tile t3"><div class="panel"><img src="../shots/events.webp" alt="" /></div><figcaption>Events across VRChat</figcaption></figure>
  <figure class="tile t4"><div class="panel"><img src="../shots/favourite%20worlds.webp" alt="" /></div><figcaption>Favourite worlds</figcaption></figure>
  <figure class="tile t5"><div class="panel"><img src="../shots/everyone.webp" alt="" /></div><figcaption>Everyone you know</figcaption></figure>
  <figure class="tile t6"><div class="panel"><img src="../shots/settings%20status%20by%20rules.webp" alt="" /></div><figcaption>Status by rules</figcaption></figure>
</body>
