<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Sunset skyline, art kept to the edges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120829"/>
      <stop offset="0.55" stop-color="#3a1160"/>
      <stop offset="0.82" stop-color="#8a1d6e"/>
      <stop offset="1" stop-color="#d9456a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <radialGradient id="calm" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#120829" stop-opacity="0.78"/>
      <stop offset="0.7" stop-color="#120829" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#120829" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="576" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.65">
    <circle cx="40" cy="36" r="1.5"/><circle cx="120" cy="80" r="1"/><circle cx="230" cy="28" r="1.3"/>
    <circle cx="800" cy="30" r="1.4"/><circle cx="900" cy="76" r="1"/><circle cx="990" cy="40" r="1.5"/>
    <circle cx="60" cy="160" r="1"/><circle cx="970" cy="170" r="1.1"/><circle cx="520" cy="20" r="1.2"/>
  </g>

  <!-- sun, low in the right corner -->
  <g>
    <circle cx="930" cy="500" r="120" fill="url(#sun)" filter="url(#glow)"/>
    <g fill="#8a1d6e"><rect x="800" y="468" width="260" height="5"/><rect x="800" y="490" width="260" height="8"/><rect x="800" y="516" width="260" height="11"/></g>
  </g>

  <!-- skyline along the bottom, tallest at the two sides -->
  <g fill="#0d0520">
    <rect x="0" y="420" width="46" height="156"/><rect x="50" y="380" width="36" height="196"/>
    <rect x="90" y="450" width="60" height="126"/><rect x="154" y="486" width="52" height="90"/>
    <rect x="210" y="510" width="80" height="66"/><rect x="294" y="528" width="120" height="48"/>
    <rect x="418" y="540" width="190" height="36"/><rect x="612" y="528" width="110" height="48"/>
    <rect x="726" y="506" width="70" height="70"/><rect x="800" y="470" width="44" height="106"/>
    <rect x="848" y="430" width="34" height="146"/><rect x="886" y="456" width="58" height="120"/>
    <rect x="948" y="400" width="76" height="176"/>
  </g>
  <g fill="#ffd166" opacity="0.85">
    <rect x="58" y="396" width="5" height="6"/><rect x="70" y="424" width="5" height="6"/><rect x="12" y="440" width="5" height="6"/>
    <rect x="104" y="470" width="5" height="6"/><rect x="856" y="446" width="5" height="6"/><rect x="866" y="474" width="5" height="6"/>
    <rect x="960" y="420" width="5" height="6"/><rect x="984" y="452" width="5" height="6"/><rect x="1000" y="500" width="5" height="6"/>
    <rect x="812" y="490" width="5" height="6"/>
  </g>

  <!-- palms in the two top corners -->
  <g fill="#0d0520">
    <path d="M0 0 C60 20 110 60 130 120 C96 84 56 62 0 54 Z"/>
    <path d="M0 40 C50 70 80 120 80 180 C60 132 34 104 0 92 Z"/>
    <path d="M1024 0 C964 20 914 60 894 120 C928 84 968 62 1024 54 Z"/>
    <path d="M1024 40 C974 70 944 120 944 180 C964 132 990 104 1024 92 Z"/>
  </g>

  <!-- the middle stays calm so Discord's own controls read clearly -->
  <rect width="1024" height="576" fill="url(#calm)"/>
</svg>
