<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576" role="img" aria-label="Anonymous VRX">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150a33"/>
      <stop offset="0.4" stop-color="#4a1470"/>
      <stop offset="0.64" stop-color="#c2257f"/>
      <stop offset="0.82" stop-color="#ff6a5c"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0f5e"/>
      <stop offset="1" stop-color="#0d0624"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#2de2e6"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="1024" height="400"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="576" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="70" cy="50" r="1.5"/><circle cx="190" cy="96" r="1"/><circle cx="310" cy="38" r="1.3"/>
    <circle cx="450" cy="70" r="1"/><circle cx="560" cy="30" r="1.6"/><circle cx="700" cy="56" r="1.2"/>
    <circle cx="840" cy="34" r="1.4"/><circle cx="960" cy="84" r="1"/><circle cx="130" cy="150" r="1"/>
  </g>

  <g clip-path="url(#sunclip)">
    <circle cx="512" cy="350" r="170" fill="url(#sun)" filter="url(#glow)"/>
    <g fill="#c2257f">
      <rect x="330" y="300" width="364" height="6"/>
      <rect x="330" y="326" width="364" height="10"/>
      <rect x="330" y="356" width="364" height="14"/>
    </g>
  </g>

  <g fill="#1a0a36">
    <rect x="60" y="330" width="46" height="72"/><rect x="112" y="296" width="34" height="106"/>
    <rect x="152" y="346" width="58" height="56"/><rect x="216" y="318" width="30" height="84"/>
    <rect x="780" y="322" width="40" height="80"/><rect x="826" y="286" width="32" height="116"/>
    <rect x="864" y="340" width="60" height="62"/><rect x="930" y="310" width="50" height="92"/>
  </g>
  <g fill="#ffd166" opacity="0.85">
    <rect x="120" y="310" width="5" height="6"/><rect x="132" y="336" width="5" height="6"/><rect x="72" y="346" width="5" height="6"/>
    <rect x="224" y="334" width="5" height="6"/><rect x="834" y="302" width="5" height="6"/><rect x="846" y="330" width="5" height="6"/>
    <rect x="790" y="340" width="5" height="6"/><rect x="942" y="328" width="5" height="6"/><rect x="960" y="352" width="5" height="6"/>
  </g>

  <rect x="0" y="400" width="1024" height="176" fill="url(#sea)"/>
  <g stroke="#ff4fa3" stroke-width="1.3" opacity="0.55">
    <line x1="0" y1="416" x2="1024" y2="416"/><line x1="0" y1="440" x2="1024" y2="440"/>
    <line x1="0" y1="476" x2="1024" y2="476"/><line x1="0" y1="526" x2="1024" y2="526"/>
    <line x1="512" y1="400" x2="-420" y2="576"/><line x1="512" y1="400" x2="-80" y2="576"/>
    <line x1="512" y1="400" x2="220" y2="576"/><line x1="512" y1="400" x2="512" y2="576"/>
    <line x1="512" y1="400" x2="804" y2="576"/><line x1="512" y1="400" x2="1104" y2="576"/>
    <line x1="512" y1="400" x2="1444" y2="576"/>
  </g>
  <rect x="0" y="399" width="1024" height="2" fill="#2de2e6" opacity="0.9"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="512" y="200" font-size="108" font-weight="800" font-style="italic" fill="url(#word)" filter="url(#glow)" letter-spacing="-2">Anonymous VRX</text>
    <text x="512" y="252" font-size="32" font-weight="600" fill="#ffffff" opacity="0.95">Your VRChat night, on one screen.</text>
  </g>
</svg>
