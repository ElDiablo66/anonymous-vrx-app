[package]
name = "anonymous-vrx"
version = "0.1.5"
description = "Your VRChat night on one screen: friends, worlds, history and your own avatars"
authors = ["El Diablo 59"]
edition = "2021"

[lib]
name = "anonymous_vrx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
